<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Transforme dados em gráficos pixel art e exporte em PNG, SVG, JPG ou WebP." />
    <title>PixelGraphy — gráficos em pixel art</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500;600;700&family=Silkscreen&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('pixelgraphy:theme'));
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PixelGraphy precisa de JavaScript. / PixelGraphy needs JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
